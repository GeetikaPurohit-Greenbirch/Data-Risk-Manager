<div class="main-container">
  <main class="dashboard-container">
    <!-- ✅ Welcome Banner -->
    <section class="welcome-banner">
      <h2>Use Cases</h2>
      <button mat-raised-button color="primary" (click)="addUseCaseScreen()">
        <i class="fa fa-clipboard" style="margin-right: 8px;"></i>
        Add Use Case
      </button>
    </section>

    <!-- ✅ Table Section -->
    <div style="border-radius: 8px;border: 1px solid rgba(24, 29, 29, 0.15);overflow: hidden;">
      <div class="system-table-container">
        <ag-grid-angular class="ag-theme-alpine responsive-grid" style="width: 100%; height: 100%;" [rowData]="rowData"
          [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="pageSize"
          (cellValueChanged)="onCellValueChanged($event)" rowSelection="single" [suppressColumnVirtualisation]="true"
          [domLayout]="'autoHeight'"> 
        </ag-grid-angular>

        <!-- ✅ Paginator -->
        <div class="paginator-container">
          <mat-paginator [length]="rowData.length" [pageSize]="pageSize" [pageSizeOptions]="[rowData.length, 5, 10, 50]"
            (page)="onPageChange($event)" (click)="patchAllLabel()">
          </mat-paginator>
        </div>
      </div>
    </div>
  </main>
</div>
