<div class="main-container">

  <main class="dashboard-container">
    <section class="welcome-banner">
      <h2>Interfaces</h2>
      <button mat-raised-button color="primary" (click)="addInterfaceScreen()">
        <i class="fa fa-random" style="margin-right: 8px;"></i>
        Add Interface
      </button>
    </section>

    <div style="border-radius: 8px; border: 1px solid rgba(24, 29, 29, 0.15); overflow: hidden;">
      <div class="system-table-container" style="height: calc(100vh - 176px); display: flex; flex-direction: column;">

        <div style="width: 100%; overflow-x: auto;height: 100%;">
          <ag-grid-angular class="ag-theme-alpine custom-grid" style="min-width: 100%; height: 100%" [rowData]="rowData"
            [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true"
            [paginationPageSize]="pageSize" (cellValueChanged)="onCellValueChanged($event)" rowSelection="single"
            [suppressColumnVirtualisation]="true" [domLayout]="'normal'">
          </ag-grid-angular>
        </div>

        <div class="paginator-container">
          <mat-paginator [length]="rowData.length" [pageSize]="pageSize" [pageSizeOptions]="[rowData.length, 5, 10, 50]"
            (page)="onPageChange($event)" (click)="patchAllLabel()">
          </mat-paginator>
        </div>
      </div>
    </div>

  </main>
</div>
<!-- <router-outlet></router-outlet> child pages like builder will open here -->
