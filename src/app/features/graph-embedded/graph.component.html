<div class="main-container">
  <main class="dashboard-container">
    <!-- ✅ Welcome Banner -->
    <section class="welcome-banner create">
      <h2>Lineage List</h2>
      <button class="button" (click)="openAddLineageDialogFromGrid()">
        <lucide-icon name="plus" size="17"></lucide-icon> Add Lineage
      </button>
    </section>

    <!-- ✅ Table Section -->
    <div class="table-container">
      <div class="system-table-container">
        <!-- <div class="grid-table">
          <ag-grid-angular class="ag-theme-alpine responsive-grid" style="width: 100%; height: 100%;" [rowData]="
            rowData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
            (cellValueChanged)="onCellValueChanged($event)" rowSelection="single" [suppressColumnVirtualisation]="true"
            [domLayout]="'autoHeight'">
          </ag-grid-angular>
        </div> -->

        <div class="ngprime-table" *ngIf="showDataFields">
          <div class="header">
            <p-toolbar>
              <div class="p-toolbar-group-left">
                <span class="p-input-icon-left">
                  <i class="pi pi-search"></i>
                  <input pInputText type="text" #globalFilter
                    (input)="dt.filterGlobal(globalFilter.value, 'contains')" placeholder="Global Search" />
                </span>
              </div>
              <div class="p-toolbar-group-right">
                <p-multiSelect [options]="cols" [(ngModel)]="selectedColumns" optionLabel="header"
                  placeholder="Choose Columns" display="chip" (onChange)="onColumnsChange($event)">
                </p-multiSelect>
              </div>
            </p-toolbar>
          </div>
          <!-- Data Table -->
          <div class="man">
            <p-table #dt [value]="rowData" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]"
              [showCurrentPageReport]="true" responsiveLayout="scroll" [globalFilterFields]="globalFilterFields"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
              styleClass="p-datatable-gridlines p-datatable-sm p-mt-2">
              <ng-template pTemplate="header">
                <tr>
                  <th *ngFor="let col of selectedColumns" [pSortableColumn]="col.field">{{ col.header }}</th>
                  <th>Actions</th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
                <tr>
                  <td *ngFor="let col of selectedColumns">{{ row[col.field] }}</td>
                  <td>
                    <button pButton icon="pi pi-pencil" class="p-button-text p-button-info"
                      (click)="editLineage(row)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-text p-button-danger"
                      (click)="deleteLineage(row)"></button>
                     
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>
<!-- <router-outlet></router-outlet> child pages like builder will open here -->
