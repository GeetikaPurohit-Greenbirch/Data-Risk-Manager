<div class="main-container">
  <main class="dashboard-container">
    <!-- ✅ Welcome Banner -->
    <section class="welcome-banner create">
      <h2>Targets</h2>
      <button class="button" (click)="addTargetScreen()">
        <i class="fa fa-bullseye" style="margin-right: 4px;"></i>
        Add Target
      </button>
    </section>

    <!-- ✅ Table Section -->
    <div class="table-container">
      <div class="system-table-container">
        <div class="grid-table">
          <ag-grid-angular class="ag-theme-alpine responsive-grid" style="width: 100%; height: 100%;"
            [rowData]="rowData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true"
            [paginationPageSize]="pageSize" (cellValueChanged)="onCellValueChanged($event)" rowSelection="single"
            [suppressColumnVirtualisation]="true" [domLayout]="'autoHeight'">
          </ag-grid-angular>
        </div>

        <!-- ✅ Paginator -->
        <div class="paginator-container">
          <mat-paginator [length]="rowData?.length" [pageSize]="pageSize"
            [pageSizeOptions]="[rowData?.length, 5, 10, 50]" (page)="onPageChange($event)" (click)="patchAllLabel()">
          </mat-paginator>
        </div>

      </div>
    </div>

  </main>
</div>
<!-- <router-outlet></router-outlet> child pages like builder will open here -->
