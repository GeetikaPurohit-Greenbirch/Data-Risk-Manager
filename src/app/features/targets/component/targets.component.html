
<div class="main-container">
  
  <main class="dashboard-container">
    <section class="welcome-banner">
        <h2>Targets</h2>
        
      <button mat-raised-button color="primary" (click)="addTargetScreen()">
        <i class="fa fa-bullseye" style="margin-right: 8px;"></i>
        Add Target
      </button>
      </section>
      <div class="system-table-container">

        <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 800px;"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="pageSize"
        (cellValueChanged)="onCellValueChanged($event)"
        rowSelection="single"
        [suppressColumnVirtualisation]="true"
        [domLayout]="'normal'"
        >
        </ag-grid-angular>

                    
<mat-paginator
[length]="rowData.length"
[pageSize]="pageSize"
[pageSizeOptions]="[rowData.length, 5, 10, 50]"
(page)="onPageChange($event)"
(click)="patchAllLabel()">
</mat-paginator>
      
      </div>
      
</main>
</div>
<!-- <router-outlet></router-outlet> child pages like builder will open here -->
